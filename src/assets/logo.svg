<svg xmlns="http://www.w3.org/2000/svg" width="1465" height="540" viewBox="20 220 1465 540" role="img" aria-labelledby="title desc">
  <title id="title">SSOHub logo</title>
  <desc id="desc">Blue shield with user and key symbol, orbital accent, and SSOHub user management wordmark.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#05d9ff" stop-opacity=".58"/>
      <stop offset=".42" stop-color="#0878ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0878ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08245d"/>
      <stop offset=".48" stop-color="#006df2"/>
      <stop offset="1" stop-color="#0a50d8"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15c7ff"/>
      <stop offset=".55" stop-color="#00f0f5"/>
      <stop offset="1" stop-color="#1473ff"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00edff"/>
      <stop offset=".52" stop-color="#0bc9ff"/>
      <stop offset="1" stop-color="#0584ff"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0568f8"/>
      <stop offset="1" stop-color="#00d6ff"/>
    </linearGradient>
    <linearGradient id="ssoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a72"/>
      <stop offset="1" stop-color="#071b42"/>
    </linearGradient>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2e7fe7" flood-opacity=".35"/>
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity=".85"/>
    </filter>
  </defs>

  <!-- transparent background -->
  <ellipse cx="325" cy="490" rx="420" ry="310" fill="url(#halo)" opacity=".95"/>
  <ellipse cx="1005" cy="505" rx="600" ry="205" fill="url(#halo)" opacity=".28"/>

  <!-- shield glow -->
  <path d="M272 270 L458 358 L458 493 C458 603 391 675 272 710 C153 675 86 603 86 493 L86 358 Z"
        fill="none" stroke="#00eaff" stroke-width="34" opacity=".34" filter="url(#cyanGlow)"/>

  <!-- shield -->
  <path d="M272 270 L458 358 L458 493 C458 603 391 675 272 710 C153 675 86 603 86 493 L86 358 Z"
        fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="28" stroke-linejoin="round"/>
  <path d="M272 299 L430 373 L430 488 C430 581 374 640 272 675 Z" fill="#005ce8" opacity=".36"/>
  <path d="M272 299 L114 373 L114 488 C114 581 170 640 272 675 Z" fill="#061c50" opacity=".55"/>

  <!-- user glyph -->
  <circle cx="270" cy="430" r="58" fill="#ffffff"/>
  <path d="M166 574 C174 512 210 492 270 492 C330 492 366 512 374 574 C342 585 307 593 270 596 C233 593 198 585 166 574 Z" fill="#ffffff"/>

  <!-- orbit -->
  <g filter="url(#softGlow)">
    <path d="M61 590 C144 652 371 599 464 522 C502 490 528 447 507 420 C486 393 435 399 397 416"
          fill="none" stroke="url(#orbitGrad)" stroke-width="24" stroke-linecap="round" opacity=".95"/>
  </g>
  <path d="M61 590 C144 652 371 599 464 522 C502 490 528 447 507 420 C486 393 435 399 397 416"
        fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- key badge -->
  <g filter="url(#softGlow)">
    <circle cx="420" cy="510" r="67" fill="#06205d" stroke="#ffffff" stroke-width="8"/>
  </g>
  <circle cx="439" cy="493" r="10" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M432 502 L392 542 L392 563 L412 563 L412 550 L426 550 L426 535 L440 521"
        fill="none" stroke="#ffffff" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="540" y="562" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="-10" fill="#000000" opacity=".42">SSO</text>
  <text x="1018" y="562" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="-10" fill="#000000" opacity=".42">Hub</text>
  <text x="538" y="550" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="-10" fill="url(#ssoGrad)">SSO</text>
  <text x="1016" y="550" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="-10" fill="url(#hubGrad)">Hub</text>

  <!-- divider -->
  <line x1="548" y1="588" x2="1450" y2="588" stroke="#75bfff" stroke-width="6" stroke-linecap="round" opacity=".78" filter="url(#softGlow)"/>
  <circle cx="987" cy="588" r="16" fill="#1177ff" filter="url(#softGlow)"/>

  <!-- subtitle -->
  <text x="568" y="661" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="500" letter-spacing="16" fill="#17365f">SSO USER MANAGEMENT</text>
</svg>
